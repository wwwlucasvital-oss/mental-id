<script>
document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();

    // Mapeamento corrigido e limpo
    const dimensoes = [
        { 
            nome: "Dimensão 1: Engajamento Reflexivo", 
            perguntas: [14], // Adicionado o número 14 para testar com a sua pergunta atual
            pontos: 0, 
            max: 5,
            sugestaoAlerta: "⚠️ <b>Foco em Reduzir a Ruminação:</b> Você tende a remoer pensamentos sem chegar a uma conclusão prática.",
            sugestaoSucesso: "🌟 <b>Engajamento Reflexivo Positivo:</b> Excelente capacidade de refletir e analisar situações sem cair na ruminação improdutiva."
        }
    ];

    let pontuacaoTotal = 0;
    let htmlDimensoes = '';

    // Processa a pontuação
    dimensoes.forEach(dimensao => {
        let pontosDimensao = 0;
        dimensao.perguntas.forEach(p => {
            const elemento = document.querySelector(`input[name="p${p}"]:checked`);
            if (elemento) {
                pontosDimensao += parseInt(elemento.value);
            }
        });
        dimensao.pontos = pontosDimensao;
        pontuacaoTotal += pontosDimensao;

        // Limiar de 50% da dimensão
        const mediaDimensao = dimensao.max / 2;
        const textoSugestao = dimensao.pontos <= mediaDimensao ? dimensao.sugestaoAlerta : dimensao.sugestaoSucesso;

        htmlDimensoes += `
            <div style="margin-bottom: 20px; padding: 15px; background: var(--bg-light); border-radius: 8px;">
                <h4 style="margin: 0 0 10px 0; color: var(--primary);">${dimensao.nome} (${dimensao.pontos}/${dimensao.max})</h4>
                <p style="margin: 0; font-size: 14px; line-height: 1.5;">${textoSugestao}</p>
            </div>
        `;
    });

    // Define perfil e mensagem geral com base no total (Ajustado para o teste de 1 pergunta)
    let perfil = '';
    let diagnostico = '';
    
    if (pontuacaoTotal <= 2) {
        perfil = "Necessita Atenção";
        diagnostico = "Sua pontuação indica um momento em que estratégias de desenvolvimento pessoal e regulação podem trazer grandes benefícios.";
    } else if (pontuacaoTotal > 2 && pontuacaoTotal <= 4) {
        perfil = "Em Equilíbrio";
        diagnostico = "Você apresenta um bom equilíbrio geral, lidando de maneira satisfatória com os desafios diários.";
    } else {
        perfil = "Excelente";
        diagnostico = "Excelente nível de desenvolvimento! Você demonstra ótima capacidade de autogestão e inteligência emocional.";
    }

    // Exibe os resultados na tela
    document.getElementById('score-text').innerText = pontuacaoTotal;
    document.getElementById('perfil-badge').innerText = perfil;
    document.getElementById('diagnostico-texto').innerHTML = diagnostico;
    document.getElementById('lista-dimensoes').innerHTML = htmlDimensoes;
});
</script>
