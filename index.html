<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental ID - Análise de Perfil</title>
    <style>
        :root {
            --primary: #4f46e5;
            --text: #1f2937;
            --bg-light: #f9fafb;
            --border: #e5e7eb;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            color: var(--text);
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitulo {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .secao-titulo {
            font-size: 18px;
            color: var(--primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
            margin-top: 30px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .pergunta-bloco {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border);
        }
        .pergunta-texto {
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 15px;
        }
        .opcoes-grupo {
            display: flex;
            gap: 20px;
            margin-top: 8px;
            margin-bottom: 8px;
        }
        .opcao-item {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .opcao-item input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }
        .legenda-escala {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #6b7280;
        }
        .btn-calcular {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .btn-calcular:hover {
            background: #4338ca;
        }
        #resultado-painel {
            display: none;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 3px solid var(--primary);
        }
        .resultado-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .score-box {
            font-size: 44px;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
        }
        .perfil-badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 16px;
            font-weight: 600;
            display: inline-block;
        }
        .diagnostico-texto {
            background: #f0fdf4;
            border-left: 4px solid #16a34a;
            padding: 15px;
            border-radius: 4px;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .diagnostico-texto.atencao {
            background: #fef2f2;
            border-left-color: #dc2626;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Mental ID</h1>
    <p class="subtitulo">Responda às questões avaliando de 1 (Discordo Totalmente) a 5 (Concordo Totalmente)</p>

    <form id="quiz-form">
        
        <!-- DIMENSÃO 1 -->
        <div class="secao-titulo">Dimensão 1: Engajamento Reflexivo</div>
        <div id="container-d1"></div>

        <!-- DIMENSÃO 2 -->
        <div class="secao-titulo">Dimensão 2: Regulação Emocional</div>
        <div id="container-d2"></div>

        <button type="submit" class="btn-calcular">Calcular Meu Perfil</button>
    </form>

    <!-- PAINEL DE RESULTADOS -->
    <div id="resultado-painel">
        <div class="resultado-header">
            <h2>Seu Resultado Geral</h2>
            <div class="score-box" id="score-text">0</div>
            <span class="perfil-badge" id="perfil-badge">Calculando...</span>
        </div>
        
        <div class="diagnostico-texto" id="diagnostico-texto">
            Sua análise aparecerá aqui.
        </div>

        <div id="dimensoes-analise" style="margin-top: 25px; border-top: 1px solid var(--border); padding-top: 20px;">
            <h3 style="font-size: 16px; color: var(--text); margin-bottom: 15px;">Análise por Dimensão e Sugestões Práticas:</h3>
            <div id="lista-dimensoes"></div>
        </div>
    </div>
</div>

<script>
// Listas de perguntas nativas em Javascript puro
const perguntasD1 = [
    "Consigo analisar meus erros passados sem me culpar excessivamente.",
    "Dedico tempo para entender a raiz dos meus sentimentos cotidianos.",
    "Busco feedbacks de pessoas próximas para avaliar meu comportamento.",
    "Quando enfrento um problema, reflito sobre soluções antes de agir por impulso.",
    "Sei identificar quais gatilhos externos afetam minha produtividade.",
    "Costumo avaliar se minhas metas de vida ainda fazem sentido para mim.",
    "Consigo separar o que é um pensamento lógico de uma preocupação irracional."
];

const perguntasD2 = [
    "Em momentos de estresse intenso, consigo me acalmar rapidamente.",
    "Não deixo que uma frustração matinal estrague o resto do meu dia.",
    "Consigo expressar minha raiva ou insatisfação de forma pacífica e clara.",
    "Mantenho a paciência mesmo quando as coisas saem do meu controle.",
    "Uso técnicas (como respiração ou pausas) para lidar com a ansiedade.",
    "Consigo tolerar críticas profissionais sem levar para o lado pessoal.",
    "Como você avalia seu nível de foco atual em momentos de pressão?"
];

// Função para renderizar as perguntas na tela de forma segura
function renderizarPerguntas(perguntas, containerId, iniciarNoNumero) {
    const container = document.getElementById(containerId);
    let htmlHTML = '';
    
    perguntas.forEach((texto, index) => {
        const num = iniciarNoNumero + index;
        htmlHTML += `
            <div class="pergunta-bloco">
                <div class="pergunta-texto">Pergunta ${num}: ${texto}</div>
                <div class="opcoes-grupo">
                    <div class="opcao-item"><input type="radio" name="p${num}" id="p${num}_1" value="1" required><label for="p${num}_1">1</label></div>
                    <div class="opcao-item"><input type="radio" name="p${num}" id="p${num}_2" value="2" required><label for="p${num}_2">2</label></div>
                    <div class="opcao-item"><input type="radio" name="p${num}" id="p${num}_3" value="3" required><label for="p${num}_3">3</label></div>
                    <div class="opcao-item"><input type="radio" name="p${num}" id="p${num}_4" value="4" required><label for="p${num}_4">4</label></div>
                    <div class="opcao-item"><input type="radio" name="p${num}" id="p${num}_5" value="5" required><label for="p${num}_5">5</label></div>
                </div>
                <div class="legenda-escala"><span>Discordo Totalmente</span><span>Concordo Totalmente</span></div>
            </div>
        `;
    });
    container.innerHTML = htmlHTML;
}

// Executa a montagem visual das perguntas assim que a página carrega
renderizarPerguntas(perguntasD1, 'container-d1', 1);
renderizarPerguntas(perguntasD2, 'container-d2', 8);

// Lógica de cálculo do formulário
document.getElementById('quiz-form').addEventListener('submit', function(e) {
    e.preventDefault();

    // Mapeamento correto das duas dimensões (7 perguntas por bloco, máx 35 pontos cada)
    const dimensoes = [
        { 
            nome: "Dimensão 1: Engajamento Reflexivo", 
            perguntas:, 
            pontos: 0, 
            max: 35,
            sugestaoAlerta: "⚠️ <b>Foco em Reduzir a Ruminação:</b> Suas respostas indicam uma tendência a remoer pensamentos sem caminhar para resoluções práticas. Experimente estipular prazos objetivos para tomar decisões.",
            sugestaoSucesso: "🌟 <b>Engajamento Reflexivo Positivo:</b> Excelente capacidade de autoanálise! Você consegue avaliar suas ações e pensamentos de forma madura e construtiva."
        },
        { 
            nome: "Dimensão 2: Regulação Emocional", 
            perguntas:, 
            pontos: 0, 
            max: 35,
            sugestaoAlerta: "⚠️ <b>Apoio na Regulação Emocional:</b> Momentos de estresse desestabilizam seu foco com facilidade. Adote pequenas pausas estratégicas e exercícios simples de respiração na sua rotina.",
            sugestaoSucesso: "🌟 <b>Regulação Emocional Saudável:</b> Você demonstra grande resiliência e estabilidade em cenários de pressão, modulando muito bem o seu humor."
        }
    ];

    let pontuacaoTotal = 0;
    let htmlDimensoes = '';

    dimensoes.forEach(dimensao => {
        let pontosDimensao = 0;
        dimensao.perguntas.forEach(p => {
            const elemento = document.querySelector(`input[name="p${p}"]:checked`);
            if (elemento) {
                pontosDimensao += parseInt(elemento.value);
            }
        });
        dimensao.pontos = pontosDimensao;
        pontuacaoTotal += pontosDimensao;

        // Corte de média na metade da pontuação máxima da dimensão (17.5)
        const mediaDimensao = dimensao.max / 2;
        const textoSugestao = dimensao.pontos <= mediaDimensao ? dimensao.sugestaoAlerta : dimensao.sugestaoSucesso;

        htmlDimensoes += `
